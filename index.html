<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FORGE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="apple-touch-startup-image" href="/icons/splash.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#0a0a0c; --surface:#111115; --card:#16161c; --border:#252530;
  --accent:#ff4d2e; --gold:#ffb800; --cyan:#00e5ff; --green:#39ff14;
  --purple:#c084fc; --text:#f0f0f8; --muted:#5a5a70; --dim:#2a2a38;
}
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; overflow:hidden; }
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.4;
}
#app { height:100vh; display:flex; flex-direction:column; max-width:430px; margin:0 auto; position:relative; overflow:hidden; }

/* HEADER */
header { padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:var(--bg); flex-shrink:0; }
.logo { font-family:'Bebas Neue',cursive; font-size:32px; letter-spacing:3px; color:var(--accent); line-height:1; }
.logo span { color:var(--text); }
.tab-pill { display:flex; background:var(--surface); border-radius:20px; padding:3px; gap:2px; }
.tab-pill button { border:none; background:transparent; color:var(--muted); font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600; letter-spacing:1px; padding:5px 12px; border-radius:16px; cursor:pointer; transition:all .2s; }
.tab-pill button.active { background:var(--accent); color:#fff; }

/* SCREENS */
.screen { display:none; flex:1; overflow-y:auto; padding:16px 16px 100px; }
.screen.active { display:block; }
.screen::-webkit-scrollbar { display:none; }

/* CATEGORY */
.cat-row { display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; }
.cat-row::-webkit-scrollbar { display:none; }
.cat-btn { flex-shrink:0; border:1.5px solid var(--border); background:transparent; color:var(--muted); font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:1.5px; padding:6px 14px; border-radius:20px; cursor:pointer; transition:all .2s; text-transform:uppercase; }
.cat-btn.active-weight { border-color:var(--accent); color:var(--accent); background:rgba(255,77,46,.08); }
.cat-btn.active-rings  { border-color:var(--purple); color:var(--purple); background:rgba(192,132,252,.08); }
.cat-btn.active-cali   { border-color:var(--green); color:var(--green); background:rgba(57,255,20,.08); }
.cat-btn.active-all    { border-color:var(--gold); color:var(--gold); background:rgba(255,184,0,.08); }

/* EXERCISE CARD */
.ex-card { background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:12px; overflow:hidden; transition:transform .15s; }
.ex-card:active { transform:scale(.98); }
.ex-card.weight-card { border-left:3px solid var(--accent); }
.ex-card.rings-card  { border-left:3px solid var(--purple); }
.ex-card.cali-card   { border-left:3px solid var(--green); }
.ex-img { width:100%; height:140px; object-fit:cover; display:block; }
.ex-img-placeholder { width:100%; height:140px; display:flex; align-items:center; justify-content:center; font-size:52px; background:linear-gradient(135deg,#1a1a22,#0d0d12); }
.ex-body { padding:12px 14px; }
.ex-name { font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; letter-spacing:.5px; }
.ex-meta { display:flex; gap:8px; margin-top:6px; align-items:center; flex-wrap:wrap; }
.ex-tag { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:3px 8px; border-radius:10px; }
.tag-weight { background:rgba(255,77,46,.15); color:var(--accent); }
.tag-rings  { background:rgba(192,132,252,.15); color:var(--purple); }
.tag-cali   { background:rgba(57,255,20,.15); color:var(--green); }
.ex-muscle { font-size:12px; color:var(--muted); }
.ex-add-btn { margin-left:auto; background:var(--accent); color:#fff; border:none; border-radius:8px; width:32px; height:32px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .15s; }
.ex-add-btn:active { transform:scale(.88); }

/* BUILD */
.section-label { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.input-field { width:100%; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-family:'Barlow',sans-serif; font-size:15px; padding:10px 14px; outline:none; transition:border-color .2s; }
.input-field:focus { border-color:var(--accent); }
.input-field::placeholder { color:var(--muted); }
.session-exercises { margin-top:8px; display:flex; flex-direction:column; gap:8px; }
.session-ex-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; }
.session-ex-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.session-ex-emoji { font-size:22px; }
.session-ex-name-input { flex:1; background:transparent; border:none; border-bottom:1px solid var(--dim); color:var(--text); font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700; padding:2px 4px; outline:none; }
.session-ex-name-input:focus { border-bottom-color:var(--accent); }
.del-btn { background:transparent; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px; }
.sets-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.set-row { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px; }
.set-row-label { font-size:10px; color:var(--muted); font-weight:600; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
.mini-input { background:var(--dim); border:none; color:var(--text); font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:600; width:100%; border-radius:6px; padding:5px 6px; outline:none; text-align:center; }
.mini-input:focus { background:#2e2e40; }
.mini-label { font-size:9px; color:var(--muted); text-align:center; margin-top:2px; }
.sets-controls { display:flex; gap:8px; margin-top:8px; }
.sets-ctrl-btn { background:var(--dim); border:none; color:var(--text); font-size:16px; border-radius:8px; padding:6px 14px; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:700; }
.sets-ctrl-btn:active { background:var(--border); }
.add-custom-btn { width:100%; border:1.5px dashed var(--border); background:transparent; color:var(--muted); font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:1px; border-radius:12px; padding:14px; cursor:pointer; transition:all .2s; margin-top:4px; }
.add-custom-btn:active { border-color:var(--accent); color:var(--accent); }
.divider { height:1px; background:var(--border); margin:14px 0; }
.start-btn { width:100%; background:linear-gradient(135deg,var(--accent),#ff7a00); border:none; color:#fff; font-family:'Bebas Neue',cursive; font-size:22px; letter-spacing:3px; padding:18px; border-radius:14px; cursor:pointer; margin-top:16px; box-shadow:0 8px 30px rgba(255,77,46,.35); transition:transform .15s; }
.start-btn:active { transform:scale(.97); }
.rest-timer-btn { width:100%; background:transparent; border:1.5px solid var(--cyan); color:var(--cyan); font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:2px; padding:12px; border-radius:10px; cursor:pointer; margin-top:8px; transition:all .2s; }
.rest-timer-btn:active { background:rgba(0,229,255,.1); }

/* TIMER */
.timer-overlay { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:500; display:none; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.timer-overlay.show { display:flex; }
.timer-ring { position:relative; width:220px; height:220px; margin-bottom:20px; }
.timer-ring svg { position:absolute; inset:0; transform:rotate(-90deg); }
.timer-ring-bg { fill:none; stroke:var(--dim); stroke-width:8; }
.timer-ring-progress { fill:none; stroke:var(--cyan); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .9s linear; }
.timer-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',cursive; font-size:72px; color:var(--cyan); letter-spacing:4px; }
.timer-label { font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:20px; }
.timer-btns { display:flex; gap:12px; }
.timer-btn { border:2px solid var(--border); background:var(--surface); color:var(--text); font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:1px; padding:12px 24px; border-radius:12px; cursor:pointer; transition:all .2s; }
.timer-btn.primary { background:var(--cyan); border-color:var(--cyan); color:#000; }
.timer-duration-row { display:flex; gap:8px; margin-top:20px; flex-wrap:wrap; justify-content:center; }
.timer-dur-btn { background:var(--dim); border:none; color:var(--muted); font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:1px; padding:8px 16px; border-radius:8px; cursor:pointer; }
.timer-dur-btn.active { background:var(--cyan); color:#000; }

/* HISTORY */
.history-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
.history-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; }
.history-name { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:700; }
.history-date { font-size:12px; color:var(--muted); margin-top:2px; }
.history-badge { font-size:10px; font-weight:700; letter-spacing:1.5px; padding:4px 10px; border-radius:20px; background:rgba(255,184,0,.12); color:var(--gold); }
.share-history-btn { background:var(--accent); border:none; color:#fff; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; letter-spacing:1px; padding:5px 12px; border-radius:20px; cursor:pointer; margin-top:6px; display:block; }
.compare-row { display:flex; gap:8px; }
.compare-block { flex:1; background:var(--surface); border-radius:10px; padding:10px 12px; }
.compare-block-label { font-size:10px; color:var(--muted); font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px; }
.compare-ex { font-size:12px; color:var(--text); margin-bottom:3px; line-height:1.4; }
.compare-ex span { color:var(--muted); }

/* SHARE MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:600; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(6px); }
.modal-overlay.show { display:flex; }
.modal-sheet { background:var(--surface); border:1px solid var(--border); border-radius:24px 24px 0 0; width:100%; max-width:430px; padding:24px 20px 40px; animation:slideUp .3s ease; max-height:92vh; overflow-y:auto; }
.modal-sheet::-webkit-scrollbar { display:none; }
@keyframes slideUp { from { transform:translateY(60px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.modal-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 20px; }
.modal-title { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700; letter-spacing:.5px; margin-bottom:4px; }
.modal-sub { font-size:13px; color:var(--muted); margin-bottom:20px; }
.share-preview { background:linear-gradient(135deg,#0f0f18,#1a0a0a); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:20px; position:relative; overflow:hidden; }
.share-preview::before { content:''; position:absolute; top:-40px; right:-40px; width:140px; height:140px; background:radial-gradient(circle,rgba(255,77,46,.25),transparent 70%); border-radius:50%; }
.share-preview-logo { font-family:'Bebas Neue',cursive; font-size:22px; color:var(--accent); letter-spacing:3px; margin-bottom:10px; }
.share-preview-name { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; margin-bottom:4px; }
.share-preview-date { font-size:12px; color:var(--muted); margin-bottom:14px; }
.share-stats-row { display:flex; gap:16px; margin-bottom:14px; }
.share-stat { text-align:center; }
.share-stat-num { font-family:'Bebas Neue',cursive; font-size:28px; color:var(--accent); line-height:1; }
.share-stat-label { font-size:10px; color:var(--muted); font-weight:700; letter-spacing:1px; text-transform:uppercase; }
.share-ex-list { font-size:13px; color:var(--muted); line-height:1.9; }
.share-ex-list span { color:var(--text); }
.share-actions { display:flex; gap:10px; flex-wrap:wrap; }
.share-action-btn { flex:1; min-width:100px; background:var(--card); border:1.5px solid var(--border); color:var(--text); font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:1px; padding:13px 12px; border-radius:12px; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:6px; }
.share-action-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.share-action-btn:active { opacity:.8; transform:scale(.97); }

/* TOAST */
.toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--green); color:#000; font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:1px; padding:10px 22px; border-radius:30px; opacity:0; transition:all .3s; z-index:700; pointer-events:none; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* BOTTOM NAV */
.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:var(--surface); border-top:1px solid var(--border); display:flex; padding:10px 0 16px; z-index:200; }
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:4px; }
.nav-icon { font-size:20px; }
.nav-label { font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; }
.nav-btn.active .nav-label { color:var(--accent); }

/* MISC */
.empty-state { text-align:center; padding:40px 20px; color:var(--muted); }
.empty-state .big-icon { font-size:48px; margin-bottom:12px; }
.empty-state p { font-family:'Barlow Condensed',sans-serif; font-size:16px; letter-spacing:.5px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">FOR<span>GE</span></div>
    <div class="tab-pill" id="mainTabs">
      <button class="active" onclick="showScreen('browse')">Browse</button>
      <button onclick="showScreen('build')">Build</button>
    </div>
  </header>

  <!-- BROWSE -->
  <div class="screen active" id="browse-screen">
    <div class="cat-row">
      <button class="cat-btn active-all" onclick="filterCat(this,'all')">All</button>
      <button class="cat-btn" onclick="filterCat(this,'weight')">🏋️ Weights</button>
      <button class="cat-btn" onclick="filterCat(this,'rings')">⭕ Rings</button>
      <button class="cat-btn" onclick="filterCat(this,'cali')">🤸 Calisthenics</button>
    </div>
    <div id="exerciseList"></div>
  </div>

  <!-- BUILD -->
  <div class="screen" id="build-screen">
    <div class="section-label">Workout Name</div>
    <input class="input-field" id="workoutName" placeholder="e.g. Monday Push Day" style="margin-bottom:16px"/>
    <div class="divider"></div>
    <div class="section-label">Exercises</div>
    <div id="sessionExercises" class="session-exercises"></div>
    <button class="add-custom-btn" onclick="addCustomExercise()">+ Add Custom Exercise</button>
    <button class="rest-timer-btn" onclick="showTimer()">⏱ &nbsp;Rest Timer</button>
    <button class="start-btn" onclick="finishWorkout()">FINISH WORKOUT</button>
  </div>

  <!-- HISTORY -->
  <div class="screen" id="history-screen">
    <div id="historyList"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-browse" onclick="navTo('browse')">
      <span class="nav-icon">🔍</span><span class="nav-label">Browse</span>
    </button>
    <button class="nav-btn" id="nav-build" onclick="navTo('build')">
      <span class="nav-icon">⚡</span><span class="nav-label">Build</span>
    </button>
    <button class="nav-btn" id="nav-history" onclick="navTo('history')">
      <span class="nav-icon">📈</span><span class="nav-label">History</span>
    </button>
  </nav>
</div>

<!-- TIMER OVERLAY -->
<div class="timer-overlay" id="timerOverlay">
  <div class="timer-ring">
    <svg viewBox="0 0 220 220" width="220" height="220">
      <circle class="timer-ring-bg" cx="110" cy="110" r="96"/>
      <circle class="timer-ring-progress" id="timerCircle" cx="110" cy="110" r="96" stroke-dasharray="603" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-num" id="timerNum">1:00</div>
  </div>
  <div class="timer-label">Rest Timer</div>
  <div class="timer-duration-row">
    <button class="timer-dur-btn" onclick="setDur(this,30)">30s</button>
    <button class="timer-dur-btn active" onclick="setDur(this,60)">60s</button>
    <button class="timer-dur-btn" onclick="setDur(this,90)">90s</button>
    <button class="timer-dur-btn" onclick="setDur(this,120)">2m</button>
    <button class="timer-dur-btn" onclick="setDur(this,180)">3m</button>
  </div>
  <div class="timer-btns" style="margin-top:24px">
    <button class="timer-btn" onclick="resetTimer()">Reset</button>
    <button class="timer-btn primary" id="timerToggleBtn" onclick="toggleTimer()">Start</button>
    <button class="timer-btn" onclick="closeTimer()">Close</button>
  </div>
</div>

<!-- SHARE MODAL -->
<div class="modal-overlay" id="shareModal" onclick="handleModalBgClick(event)">
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Share Workout 🔥</div>
    <div class="modal-sub">Your session summary — show the world</div>
    <div class="share-preview" id="sharePreview"></div>
    <div class="share-actions">
      <button class="share-action-btn" onclick="copyWorkoutText()">📋 Copy</button>
      <button class="share-action-btn" onclick="nativeShare()">📤 Share</button>
      <button class="share-action-btn primary" onclick="closeShareModal()">Done ✓</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── DATA ───────────────────────────────────────

  {id:'r4', name:'Ring Push-Up',        cat:'rings',  muscle:'Chest · Core',      emoji:'⭕'},
  {id:'r5', name:'Muscle-Up (Rings)',   cat:'rings',  muscle:'Full Upper Body',   emoji:'⭕'},
  {id:'r6', name:'Ring L-Sit',          cat:'rings',  muscle:'Core · Hip Flexors',emoji:'⭕'},
  {id:'r7', name:'Ring Archer Row',     cat:'rings',  muscle:'Back · Biceps',     emoji:'⭕'},
  {id:'r8', name:'Ring Face Pull',      cat:'rings',  muscle:'Rear Delt · Traps', emoji:'⭕'},
  {id:'r9', name:'Ring Bicep Curl',     cat:'rings',  muscle:'Biceps',            emoji:'⭕'},
  {id:'r10',name:'Ring Tricep Extension',cat:'rings', muscle:'Triceps',           emoji:'⭕'},

// ─── STATE ──────────────────────────────────────
let sessionExercises = [];
let workoutHistory = JSON.parse(localStorage.getItem('forge_history')||'[]');
let currentCat = 'all';
let timerDuration = 60, timerRemaining = 60, timerRunning = false, timerInterval = null;
let lastWorkout = null;

// ─── NAV ────────────────────────────────────────
function navTo(name) {
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+name).classList.add('active');
  showScreen(name);
  const tabs = document.querySelectorAll('#mainTabs button');
  tabs[0].classList.toggle('active', name==='browse');
  tabs[1].classList.toggle('active', name==='build');
}
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name+'-screen').classList.add('active');
  document.querySelectorAll('#mainTabs button').forEach((b,i)=>{
    b.classList.toggle('active',(name==='browse'&&i===0)||(name==='build'&&i===1));
  });
  if(name==='history') renderHistory();
}

// ─── BROWSE ─────────────────────────────────────
function filterCat(btn, cat) {
  document.querySelectorAll('.cat-btn').forEach(b=>b.className='cat-btn');
  btn.classList.add('active-'+cat);
  currentCat=cat; renderExercises();
}

function renderExercises() {
  const list = EXERCISES.filter(e=>currentCat==='all'||e.cat===currentCat);
  const catLabel = {weight:'Weights',rings:'Rings',cali:'Calisthenics'};
  document.getElementById('exerciseList').innerHTML = list.map(ex=>`
    <div class="ex-card ${ex.cat}-card">
      <img class="ex-img" src="${IMG[ex.id]||''}" alt="${ex.name}" loading="lazy"
        onerror="this.style.display='none';this.nextSibling.style.display='flex'">
      <div class="ex-img-placeholder" style="display:none">${ex.emoji}</div>
      <div class="ex-body">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-meta">
          <span class="ex-tag tag-${ex.cat}">${catLabel[ex.cat]}</span>
          <span class="ex-muscle">${ex.muscle}</span>
          <button class="ex-add-btn" onclick="addToSession('${ex.id}',event)">+</button>
        </div>
        ${TIPS[ex.id]?`<div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5">💡 ${TIPS[ex.id]}</div>`:''}
      </div>
    </div>`).join('');
}

// ─── SESSION BUILD ───────────────────────────────
function addToSession(id, e) {
  e&&e.stopPropagation();
  const ex = EXERCISES.find(x=>x.id===id);
  sessionExercises.push({uid:Date.now()+'_'+id, name:ex.name, cat:ex.cat, emoji:ex.emoji, sets:[{reps:'',weight:''}]});
  renderSession(); navTo('build');
  showToast(ex.name+' added!');
}
function addCustomExercise() {
  sessionExercises.push({uid:Date.now()+'_custom', name:'Custom Exercise', cat:'weight', emoji:'💪', sets:[{reps:'',weight:''}]});
  renderSession();
}
function removeEx(uid) { sessionExercises=sessionExercises.filter(e=>e.uid!==uid); renderSession(); }
function updateExName(uid,val){ const e=sessionExercises.find(x=>x.uid===uid); if(e)e.name=val; }
function updateSet(uid,si,field,val){ const e=sessionExercises.find(x=>x.uid===uid); if(e)e.sets[si][field]=val; }
function addSet(uid){ const e=sessionExercises.find(x=>x.uid===uid); if(e){e.sets.push({reps:'',weight:''});renderSession();} }
function removeSet(uid){ const e=sessionExercises.find(x=>x.uid===uid); if(e&&e.sets.length>1){e.sets.pop();renderSession();} }

function renderSession() {
  const el=document.getElementById('sessionExercises');
  if(!sessionExercises.length){
    el.innerHTML=`<div class="empty-state"><div class="big-icon">💪</div><p>Browse exercises and tap + to add</p></div>`;
    return;
  }
  el.innerHTML=sessionExercises.map(ex=>`
    <div class="session-ex-card" id="sec-${ex.uid}">
      <div class="session-ex-header">
        <span class="session-ex-emoji">${ex.emoji}</span>
        <input class="session-ex-name-input" value="${ex.name}" onchange="updateExName('${ex.uid}',this.value)"/>
        <button class="del-btn" onclick="removeEx('${ex.uid}')">✕</button>
      </div>
      <div class="sets-grid" id="sg-${ex.uid}">
        ${ex.sets.map((s,si)=>`
          <div class="set-row">
            <div class="set-row-label">Set ${si+1}</div>
            <div style="display:flex;gap:4px">
              <div style="flex:1">
                <input class="mini-input" type="number" placeholder="—" value="${s.reps}" oninput="updateSet('${ex.uid}',${si},'reps',this.value)" inputmode="numeric">
                <div class="mini-label">Reps</div>
              </div>
              <div style="flex:1">
                <input class="mini-input" type="number" placeholder="—" value="${s.weight}" oninput="updateSet('${ex.uid}',${si},'weight',this.value)" inputmode="decimal">
                <div class="mini-label">lbs</div>
              </div>
            </div>
          </div>`).join('')}
      </div>
      <div class="sets-controls">
        <button class="sets-ctrl-btn" onclick="addSet('${ex.uid}')">+ Set</button>
        ${ex.sets.length>1?`<button class="sets-ctrl-btn" onclick="removeSet('${ex.uid}')">− Set</button>`:''}
      </div>
    </div>`).join('');
}

// ─── FINISH ──────────────────────────────────────
function finishWorkout() {
  if(!sessionExercises.length){ showToast('Add at least one exercise!'); return; }
  // Capture any live input values
  sessionExercises.forEach(ex=>{
    const card=document.getElementById('sec-'+ex.uid);
    if(!card) return;
    const inputs=card.querySelectorAll('.mini-input');
    ex.sets.forEach((s,si)=>{ if(inputs[si*2])s.reps=inputs[si*2].value; if(inputs[si*2+1])s.weight=inputs[si*2+1].value; });
  });
  const name=(document.getElementById('workoutName').value.trim())||'Untitled Workout';
  const record={
    id:Date.now(), name,
    date:new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}),
    timestamp:Date.now(),
    exercises:JSON.parse(JSON.stringify(sessionExercises))
  };
  workoutHistory.unshift(record);
  if(workoutHistory.length>60) workoutHistory.pop();
  localStorage.setItem('forge_history',JSON.stringify(workoutHistory));
  lastWorkout=record;
  sessionExercises=[]; document.getElementById('workoutName').value='';
  renderSession();
  showShareModal(record);
}

// ─── TIMER ───────────────────────────────────────
const CIRC=2*Math.PI*96;
function showTimer(){ document.getElementById('timerOverlay').classList.add('show'); updateTimerUI(); }
function closeTimer(){ document.getElementById('timerOverlay').classList.remove('show'); }
function setDur(btn,sec){
  document.querySelectorAll('.timer-dur-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  clearInterval(timerInterval); timerRunning=false;
  document.getElementById('timerToggleBtn').textContent='Start';
  timerDuration=sec; timerRemaining=sec; updateTimerUI();
}
function toggleTimer(){
  if(timerRunning){ clearInterval(timerInterval); timerRunning=false; document.getElementById('timerToggleBtn').textContent='Resume'; }
  else {
    if(timerRemaining<=0) timerRemaining=timerDuration;
    timerRunning=true; document.getElementById('timerToggleBtn').textContent='Pause';
    timerInterval=setInterval(()=>{
      timerRemaining--;  updateTimerUI();
      if(timerRemaining<=0){
        clearInterval(timerInterval); timerRunning=false;
        document.getElementById('timerToggleBtn').textContent='Start';
        navigator.vibrate&&navigator.vibrate([200,100,200,100,400]);
        showToast('⏱ Rest Over — GO!');
      }
    },1000);
  }
}
function resetTimer(){ clearInterval(timerInterval); timerRunning=false; timerRemaining=timerDuration; document.getElementById('timerToggleBtn').textContent='Start'; updateTimerUI(); }
function updateTimerUI(){
  const m=Math.floor(timerRemaining/60),s=timerRemaining%60;
  document.getElementById('timerNum').textContent=`${m}:${s.toString().padStart(2,'0')}`;
  document.getElementById('timerCircle').style.strokeDashoffset=CIRC*(1-timerRemaining/timerDuration);
}

// ─── HISTORY ─────────────────────────────────────
function renderHistory(){
  const el=document.getElementById('historyList');
  if(!workoutHistory.length){
    el.innerHTML=`<div class="empty-state"><div class="big-icon">📊</div><p>Complete a workout to see history</p></div>`;
    return;
  }
  el.innerHTML=workoutHistory.map((w,i)=>{
    const prev=workoutHistory[i+1];
    return `
    <div class="history-card">
      <div class="history-header">
        <div>
          <div class="history-name">${w.name}</div>
          <div class="history-date">${w.date}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="history-badge">${w.exercises.length} exercises</span>
          <button class="share-history-btn" onclick="showShareModal(workoutHistory[${i}])">Share 📤</button>
        </div>
      </div>
      ${prev?`
      <div class="compare-row">
        <div class="compare-block">
          <div class="compare-block-label">This Session</div>
          ${w.exercises.map(e=>`<div class="compare-ex">${e.emoji} ${e.name} <span>· ${e.sets.length} sets</span></div>`).join('')}
        </div>
        <div class="compare-block">
          <div class="compare-block-label">Previous</div>
          ${prev.exercises.map(e=>`<div class="compare-ex">${e.emoji} ${e.name} <span>· ${e.sets.length} sets</span></div>`).join('')}
        </div>
      </div>`:`<div style="font-size:12px;color:var(--gold);margin-top:4px">🏆 First recorded session!</div>`}
    </div>`;
  }).join('');
}

// ─── SHARE ───────────────────────────────────────
function showShareModal(record){
  lastWorkout=record;
  const totalSets=record.exercises.reduce((s,e)=>s+e.sets.length,0);
  const totalReps=record.exercises.reduce((s,e)=>s+e.sets.reduce((a,b)=>a+(parseInt(b.reps)||0),0),0);
  document.getElementById('sharePreview').innerHTML=`
    <div class="share-preview-logo">FORGE</div>
    <div class="share-preview-name">${record.name}</div>
    <div class="share-preview-date">${record.date}</div>
    <div class="share-stats-row">
      <div class="share-stat"><div class="share-stat-num">${record.exercises.length}</div><div class="share-stat-label">Exercises</div></div>
      <div class="share-stat"><div class="share-stat-num">${totalSets}</div><div class="share-stat-label">Sets</div></div>
      <div class="share-stat"><div class="share-stat-num">${totalReps}</div><div class="share-stat-label">Reps</div></div>
    </div>
    <div class="share-ex-list">
      ${record.exercises.map(e=>`<span>${e.emoji} ${e.name}</span> — ${e.sets.length} sets<br>`).join('')}
    </div>`;
  document.getElementById('shareModal').classList.add('show');
}
function closeShareModal(){ document.getElementById('shareModal').classList.remove('show'); navTo('history'); }
function handleModalBgClick(e){ if(e.target===document.getElementById('shareModal')) closeShareModal(); }

function buildShareText(r){
  const totalSets=r.exercises.reduce((s,e)=>s+e.sets.length,0);
  const totalReps=r.exercises.reduce((s,e)=>s+e.sets.reduce((a,b)=>a+(parseInt(b.reps)||0),0),0);
  let t=`💪 FORGE Workout\n${r.name} — ${r.date}\n\n`;
  t+=`📊 ${r.exercises.length} exercises · ${totalSets} sets · ${totalReps} total reps\n\n`;
  r.exercises.forEach(e=>{
    t+=`${e.emoji} ${e.name}\n`;
    e.sets.forEach((s,i)=>{ t+=`  Set ${i+1}: ${s.reps||'—'} reps${s.weight?' @ '+s.weight+'lb':''}\n`; });
    t+='\n';
  });
  t+='Tracked with FORGE 🔥';
  return t;
}
function copyWorkoutText(){
  if(!lastWorkout) return;
  const txt=buildShareText(lastWorkout);
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(()=>showToast('Copied!')).catch(()=>fallbackCopy(txt));
  } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); showToast('Copied!'); }catch(e){ showToast('Copy failed'); }
  document.body.removeChild(ta);
}
function nativeShare(){
  if(!lastWorkout) return;
  const txt=buildShareText(lastWorkout);
  if(navigator.share){
    navigator.share({title:'FORGE — '+lastWorkout.name, text:txt}).catch(()=>{});
  } else { copyWorkoutText(); }
}

// ─── TOAST ───────────────────────────────────────
let toastTO;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTO); toastTO=setTimeout(()=>t.classList.remove('show'),2600);
}

// ─── INIT ────────────────────────────────────────
renderExercises();
renderSession();
updateTimerUI();
